name: Build violin experimental module

on:
  push:
    branches: [violin-os3.0.305]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: |
          node --check agent/oah_v2_agent.js
          node --check webroot/app.js
          node --check webroot/ksu.js
      - name: Test guards and package pinned runtime
        run: python3 ci/build_violin.py
      - name: Upload module and verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OPlusAutoHR-violin-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
